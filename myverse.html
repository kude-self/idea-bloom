<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f4">
<title>MYVERSE｜我的世界創造器</title>
<style>html,body{margin:0;min-height:100%;background:#fff9f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#453c3a}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loading b{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:13px;color:#8f827c}</style>
</head>
<body>
<div class="loading" id="boot"><div><b>✦ MYVERSE 正在準備中</b><span>一個想法，創造你的世界。</span></div></div>
<script>
(async function(){
  try{
    const r=await fetch('./index.html?v=stable3-20260821',{cache:'no-store'});
    if(!r.ok) throw new Error('load failed');
    let s=await r.text();
    // 範例卡只負責套用內容：不聚焦輸入框、不叫出鍵盤、不改變目前捲動位置。
    s=s.replace("renderIdeas();save();el('idea').focus()}","renderIdeas();save()}");
    s=s.replace("var VERSION='2026.08.21-stable2'","var VERSION='2026.08.21-stable3-nojump'");
    document.open();
    document.write(s);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><b>目前無法載入 MYVERSE</b><span>請重新整理頁面後再試一次。</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
