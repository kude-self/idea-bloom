<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f4">
<title>MYVERSE｜我的世界創造器</title>
<style>
html,body{margin:0;min-height:100%;background:#fff9f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#453c3a}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loading b{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:13px;color:#8f827c}
</style>
</head>
<body>
<div class="loading" id="boot"><div><b>✦ MYVERSE 正在準備中</b><span>一個想法，創造你的世界。</span></div></div>
<script>
(async function(){
  try{
    const r=await fetch('./index.html?v=sale-ready-5-20260821',{cache:'no-store'});
    if(!r.ok) throw new Error('load failed');
    let s=await r.text();

    // 1) 範例卡只套用內容，不搶焦點、不叫鍵盤、不改變目前捲動位置。
    s=s.replace("renderIdeas();save();el('idea').focus()}","renderIdeas();save()}");

    // 2) 販售版只保留能做深的核心方向，不用大量半成品類型混淆客人。
    const core="var primary=['orders','booking','money','learning','content','copy','course','work','free']";
    s=s.replace(/var primary=\[[^\]]*\]/,core);
    s=s.replace("state.more?Object.keys(D):primary","primary");
    s=s.replace("Object.keys(D).map(function(k){return '<option","primary.map(function(k){return '<option");
    s=s.replace('</style>','.more{display:none!important}</style>');

    // 3) 分類偵測只對應正式保留的核心方向。
    s=s.replace(/function detect\(text\)\{.*?\}function go\(/s,
      "function detect(text){var rules=[['booking',['預約','美甲','美睫','美容','時段']],['money',['記帳','收支','收入','支出','預算','財務']],['orders',['訂單','銷售','微商','付款','出貨']],['course',['課程','學員','學生','作業']],['learning',['學習','讀書','複習','排程']],['content',['自媒體','拍攝','選題','發布','內容工作台']],['copy',['文案','腳本','貼文','短影音']],['work',['任務','待辦','專案','工作管理']]];for(var i=0;i<rules.length;i++)for(var j=0;j<rules[i][1].length;j++)if(text.indexOf(rules[i][1][j])>-1)return rules[i][0];return'free'}function go(");

    // 4) 把產出品質門檻直接包進每一份完整指令：不是只有外觀，而是可用、夠完整、可驗收。
    s=s.replace('function renderResult(){', `var __myverseBasePrompt=promptText;
promptText=function(){
  var base=__myverseBasePrompt();
  var gate='\\n\\n【MYVERSE｜完整度與功能驗收門檻】\\n'
    +'1. 不要交付空殼、迷你示意版或只有幾個卡片的作品。第一版必須有足夠內容，讓使用者一打開就知道怎麼用、可以直接測試。\\n'
    +'2. 畫面上每一個可點的東西都必須真的有作用。按鈕、頁籤、導覽、表單、搜尋、篩選、抽取、新增、編輯、刪除、儲存、匯入、匯出、返回、下一步，不得有任何一個是裝飾。\\n'
    +'3. 禁止使用 #、javascript:void(0)、TODO、尚未開放、之後再做、空函式或沒有事件的元素冒充功能。做不到的功能就不要顯示。\\n'
    +'4. 需要資料才能運作的功能，必須真的內建可編輯的示範資料，而不是只顯示 0。題庫、內容庫、分類、服務、課程、專案等，都要有足夠初始內容。\\n'
    +'5. 如果有題庫／抽一題／隨機推薦：資料庫至少要有 12 筆可用內容，抽取後要真的把內容帶入下一個可操作區域。\\n'
    +'6. 如果有清單管理：至少放 3～6 筆不同狀態的示範資料，並確保搜尋、篩選、編輯、刪除與統計真的會隨資料變化。\\n'
    +'7. 如果有儀表板數字：全部必須由真實資料動態計算，不能寫死。新增、刪除、修改資料後數字要同步更新。\\n'
    +'8. 如果有 localStorage：請實際寫入、讀取、重新整理後還原；不要只在文字中說有保存。\\n'
    +'9. 手機版優先檢查：不可橫向跑版、固定區塊不可擋住內容、按鈕要有足夠觸控區域，選擇卡片不得莫名跳回頁首或叫出鍵盤。\\n'
    +'10. 交付前請逐一檢查 DOM 中所有 button、a、input、select、textarea 與動態產生的互動元素，確認每一個都有對應行為與結果。\\n'
    +'11. 先修正再交付：只要發現一個按鈕沒有反應、資料是空的、流程走不完或內容太少，就不要先交件。\\n'
    +'12. 完成時附上「功能驗收表」：功能名稱／操作方式／預期結果／實際結果，逐項列出，不可以只寫一句已測試。\\n'
    +'13. 內容量原則：寧願少做一個功能，也不要每個功能都只有一點點。保留下來的每一個區塊都必須有足夠內容與完整操作閉環。\\n'
    +'14. 請一次提供完整可執行成果，不省略 JavaScript、事件綁定、初始化資料或 CSS，不使用「其餘同上」代替程式碼。';
  return base+gate;
};
function renderResult(){`);

    // 5) 標記新版，避開舊暫存。
    s=s.replace("var VERSION='2026.08.21-stable2'","var VERSION='2026.08.21-sale5-quality'" );
    s=s.replace("STORAGE='myverse_stable_v2'","STORAGE='myverse_sale_v5'" );

    document.open();
    document.write(s);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><b>目前無法載入 MYVERSE</b><span>請重新整理頁面後再試一次。</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
