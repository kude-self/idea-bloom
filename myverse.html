<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f4">
<title>MYVERSE｜我的世界創造器</title>
<style>
html,body{margin:0;min-height:100%;background:#fff9f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#453c3a}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loading b{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:13px;color:#8f827c}
</style>

<body>
<div class="loading" id="boot"><div><b>✦ MYVERSE 正在準備中</b><span>一個想法，創造你的世界。</span></div></div>
<script>
(async function(){
  try{
    const r=await fetch('./index.html?v=sale-ready-20260821',{cache:'no-store'});
    if(!r.ok) throw new Error('load failed');
    let s=await r.text();

    s=s.replace("renderIdeas();save();el('idea').focus()}","renderIdeas();save()}");

    const core="var primary=['orders','booking','money','learning','content','copy','course','work','free']";
    s=s.replace(/var primary=\[[^\]]*\]/,core);
    s=s.replace("state.more?Object.keys(D):primary","primary");
    s=s.replace("Object.keys(D).map(function(k){return '<option","primary.map(function(k){return '<option");
    s=s.replace('</style>','.more{display:none!important}</style>');

    s=s.replace(/function detect\(text\)\{.*?\}function go\(n\)/,
      "function detect(text){var rules=[['booking',['預約','美甲','美睫','美容','時段']],['money',['記帳','收支','收入','支出','預算','財務']],['orders',['訂單','銷售','微商','付款','出貨']],['course',['課程','學員','學生','作業']],['learning',['學習','讀書','複習','排程']],['content',['自媒體','拍攝','選題','發布','內容工作台']],['copy',['文案','腳本','貼文','短影音']],['work',['任務','待辦','專案','工作管理']]];for(var i=0;i<rules.length;i++)for(var j=0;j<rules[i][1].length;j++)if(text.indexOf(rules[i][1][j])>-1)return rules[i][0];return'free'}function go(n)");

    s=s.replace(
      "- 畫面上出現的所有按鈕、上一頁／下一步、頁籤、選單、表單、新增、編輯、刪除、搜尋、篩選、匯入／匯出、重設，都必須有真實功能，不得有假按鈕。",
      "- 畫面上出現的所有按鈕、上一頁／下一步、頁籤、選單、表單、新增、編輯、刪除、搜尋、篩選、抽取、匯入／匯出、重設，都必須有真實功能與可觀察結果。\\n- 不允許假按鈕、空資料庫、空選單、無內容的『抽一題』、點了沒反應的卡片，或只有外觀沒有邏輯的控制項。\\n- 需要資料才能運作的功能，第一版必須先提供清楚標示為『示範資料』的初始內容，讓使用者第一次打開就能測試。\\n- 所有統計必須由實際資料計算；搜尋與篩選必須真的改變結果；匯出要真的產生檔案；匯入要真的還原資料。\\n- 手機版不得因 focus 或 scrollIntoView 造成不必要的畫面跳動；只有使用者主動點輸入欄位時才叫出鍵盤。"
    );
    s=s.replace(
      "- 若某功能做不到，不要留下失效元件，改成可行替代方式。",
      "- 若某功能無法完整實作，直接刪除該功能與相關提示文字，不要留下半成品。"
    );
    s=s.replace(
      "- 交付前必須自行做完整互動驗收：逐一點過所有按鈕；建立、修改、刪除測試資料；測搜尋／篩選；重新整理確認資料；手機尺寸再測一次。發現問題先修好再交付。",
      "- 交付前必須自行做端到端驗收：逐一點過所有按鈕；新增、修改、刪除測試資料；測搜尋／篩選／抽取／統計；重新整理確認資料；手機尺寸再測一次。發現問題先修好再交付。\\n- 完成後請列出『已實際驗收的互動清單』，不要只寫『已測試』。"
    );

    const replacements=[
      ["我想做一套自己的訂單管理系統，可以記錄客戶姓名、聯絡方式、商品、數量、金額、付款狀態與出貨狀態，也能搜尋訂單、依日期或狀態篩選，並查看每月訂單與銷售統計。","我想做一套自己的訂單管理系統，可以記錄客戶姓名、聯絡方式、商品、數量、金額、付款狀態與出貨狀態，也能搜尋訂單、依日期或狀態篩選，並查看每月訂單與銷售統計。第一版請先放 3 筆清楚標示為示範資料的訂單，並預設付款狀態與出貨狀態，讓搜尋、篩選、編輯、刪除和統計一打開就能測。"],
      ["我是服務工作者，想做一個預約系統，讓客人可以選服務項目、日期與時段，填寫姓名和聯絡方式後完成預約；我自己可以查看、修改與取消預約，也要避免同一時段被重複預約。","我是服務工作者，想做一個預約系統，讓客人可以選服務項目、日期與時段，填寫姓名和聯絡方式後完成預約；我自己可以查看、修改與取消預約，也要避免同一時段被重複預約。第一版請先提供 3 個示範服務、至少 6 個時段與 2 筆示範預約，讓新增、改期、取消與防止重複預約都能直接測。"],
      ["我想做一套個人記帳系統，可以新增收入與支出、記錄日期、金額、分類和備註，查看每月收入、支出與結餘，也能搜尋、篩選，並提供資料備份與還原。","我想做一套個人記帳系統，可以新增收入與支出、記錄日期、金額、分類和備註，查看每月收入、支出與結餘，也能搜尋、篩選，並提供資料備份與還原。第一版請先內建常用收支分類與 5 筆示範收支，讓統計、搜尋、篩選、編輯、刪除與備份可以直接驗收。"],
      ["我想做一套自己的學習排程工具，可以設定學習目標、安排每日與每週任務、記錄完成狀態、設定複習日期，並清楚看到目前進度和還沒完成的內容。","我想做一套自己的學習排程工具，可以設定學習目標、安排每日與每週任務、記錄完成狀態、設定複習日期，並清楚看到目前進度和還沒完成的內容。第一版請先放 1 個示範學習目標與 5 筆不同日期、不同完成狀態的任務，讓完成勾選、進度計算、日期篩選與修改都能直接測。"],
      ["我想做一套自媒體內容工作台，可以整理內容主題、選題、貼文文案、短影音腳本、拍攝素材、發布平台和日期，也能標記企劃中、拍攝中、待發布、已發布等狀態。","我想做一套自媒體內容工作台，可以整理內容主題、選題、貼文文案、短影音腳本、拍攝素材、發布平台和日期，也能標記企劃中、拍攝中、待發布、已發布等狀態。選題資料庫第一版至少內建 12 個可修改的示範選題；如果有『從選題庫抽一題／隨機抽題』按鈕，必須真的能從這些題目抽取並自動帶入內容產出區。"],
      ["我想建立一套文案與短影音腳本產出方式，讓我輸入主題、目標受眾、內容目的和想要的語氣後，可以整理出貼文、短影音腳本、開頭鉤子、重點內容與行動引導。","我想建立一套文案與短影音腳本產出方式，讓我輸入主題、目標受眾、內容目的和想要的語氣後，可以整理出貼文、短影音腳本、開頭鉤子、重點內容與行動引導。若畫面有套用範例，第一版至少內建 6 組完整示範；若直接產出內容，至少要有完整貼文與完整短影音腳本各 1 版，不要只給大綱。"],
      ["我想做一套課程與學員管理系統，可以記錄學生資料、課程或班別、上課日期、學習進度、作業與回饋，並能搜尋學員、查看每位學員的歷史紀錄。","我想做一套課程與學員管理系統，可以記錄學生資料、課程或班別、上課日期、學習進度、作業與回饋，並能搜尋學員、查看每位學員的歷史紀錄。第一版請先建立 1 個示範課程、3 位示範學員與不同的進度／作業狀態，讓新增、編輯、搜尋、篩選和歷史紀錄可以立即測。"],
      ["我想做一套工作任務管理工具，可以建立不同專案和任務、設定截止日期、優先順序和完成狀態，也能搜尋、篩選並快速看到今天或即將到期的事情。","我想做一套工作任務管理工具，可以建立不同專案和任務、設定截止日期、優先順序和完成狀態，也能搜尋、篩選並快速看到今天或即將到期的事情。第一版請先建立 2 個示範專案與 6 筆不同優先順序、日期和狀態的任務，讓新增、完成勾選、狀態切換、搜尋、篩選與到期提示都能直接測。"],
      ["我有一個自己的想法，想做成一個可以實際使用的工具、網站或內容。請依照我的用途，幫我補齊第一版真正需要的內容、操作流程與畫面，再整理成完整製作指令。","我有一個自己的想法，想做成一個可以實際使用的工具、網站或內容。請依照我的用途，幫我補齊第一版真正需要的內容、操作流程與畫面，再整理成完整製作指令。只保留可以完整做好的功能；如果出現資料庫、清單、選單、抽取、篩選、統計或其他控制項，第一版必須有足夠示範資料可以立刻驗證。"]
    ];
    replacements.forEach(([a,b])=>{s=s.replace(a,b)});

    s=s.replace("var VERSION='2026.08.21-stable2'","var VERSION='2026.08.21-sale-ready-v1'");
    s=s.replace("STORAGE='myverse_stable_v2'","STORAGE='myverse_sale_ready_v1'");

    document.open();
    document.write(s);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><b>目前無法載入 MYVERSE</b><span>請重新整理頁面後再試一次。</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
