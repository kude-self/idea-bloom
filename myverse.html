<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f4">
<title>MYVERSE｜我的世界創造器</title>
<style>
html,body{margin:0;min-height:100%;background:#fff9f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#453c3a}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loading b{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:13px;color:#8f827c}
</style>
</head>
<body>
<div class="loading" id="boot"><div><b>✦ MYVERSE 正在準備中</b><span>把想法整理成完整 AI 製作指令。</span></div></div>
<script>
(async function(){
  try{
    const r=await fetch('./index.html?v=prompt-builder-20260821',{cache:'no-store'});
    if(!r.ok) throw new Error('load failed');
    let s=await r.text();

    // 範例卡只作為靈感入口：不聚焦、不叫鍵盤、不改變目前捲動位置。
    s=s.replace("renderIdeas();save();el('idea').focus()}","renderIdeas();save()}");

    // 重新定位：這不是模板庫，而是把想法整理成完整製作指令。
    s=s.replace('每一個都能直接套用','只是靈感入口，可自由修改');
    s=s.replace('我先替你補齊基礎，你只要留下第一版真的要用的項目。','我會依你的方向補齊製作所需資訊，你只要留下真正重要的內容。');
    s=s.replace('留下真正需要的內容','整理你的製作需求');
    s=s.replace('你的完整製作指令好了','你的專屬 AI 製作指令好了');

    // 產出的 Prompt 加上通用的完整製作規格，不綁固定模板。
    s=s.replace('function renderResult(){', `var __myverseBasePrompt=promptText;
promptText=function(){
  var base=__myverseBasePrompt();
  var d=D[state.key]||D.free;
  var selected=needs();
  var detail='\\n\\n【MYVERSE｜請依需求自行設計，不使用固定模板】\\n'
    +'1. 請先理解我的用途，再自行決定最合理的頁面、資料欄位、操作流程與資訊層級，不要硬套既有模板。\\n'
    +'2. 我提供的是方向，不代表每個項目都一定要做成按鈕；只有真正需要且能完整實作的功能才放進第一版。\\n'
    +'3. 第一版必須可直接使用，不要只給架構、示意圖、空白卡片或待完成區塊。\\n'
    +'4. 畫面上所有可點擊元素都必須有實際作用。按鈕、頁籤、表單、搜尋、篩選、新增、編輯、刪除、儲存、返回、下一步、匯入、匯出、抽取等，只要出現就必須真的能運作。\\n'
    +'5. 做不到或沒有必要的功能直接不要顯示，不准用 #、空連結、TODO、尚未開放、之後再做或空函式冒充。\\n'
    +'6. 需要資料才能看懂的區塊，請放少量且清楚標示的示範資料，讓第一次打開就知道怎麼使用；不要全部顯示 0。\\n'
    +'7. 如果需求涉及題庫、內容庫、分類、服務、課程、專案或其他資料集合，請提供足以測試功能的初始內容；若沒有這類需求，不要硬加。\\n'
    +'8. 如果有統計，必須由實際資料計算；如果有搜尋／篩選，必須真的改變結果；如果有 localStorage，重新整理後資料必須保留。\\n'
    +'9. 手機版必須優先可用：不可跑版、按鈕不可太小、固定區塊不可遮住內容，點選卡片不得莫名跳回頁首或自動叫出鍵盤。\\n'
    +'10. 交付前逐一檢查所有互動元件與主要流程；只要有任何一個按鈕無反應、表單無效、流程走不完或資料無法保存，就先修正再交付。\\n'
    +'11. 請一次提供完整可執行成果，不省略必要程式碼，不使用「其餘同上」取代。\\n'
    +'12. 完成時用簡短清單告訴我：你實際做了哪些功能、哪些刻意沒有加入，以及我該怎麼測試。';
  if(state.key==='content') detail+='\\n\\n【自媒體方向補充】如果你設計選題庫或「抽一題」功能，題庫必須真的有內容、能新增／編輯／刪除，抽取後要把題目帶入後續內容區；若第一版無法完整做到，就不要放這個按鈕。';
  if(state.key==='booking') detail+='\\n\\n【預約方向補充】如果做日期／時段選擇，必須能真正選取並避免明顯重複時段；若只適合單機展示，不要假裝成多人即時預約系統。';
  if(state.key==='money') detail+='\\n\\n【記帳方向補充】收入、支出、分類、月份統計與搜尋若出現在第一版，就必須互相連動，數字不能寫死。';
  if(state.key==='orders') detail+='\\n\\n【訂單方向補充】新增、付款狀態、出貨狀態、搜尋與統計若出現，就必須對同一批實際資料運作。';
  if(state.key==='learning'||state.key==='course'||state.key==='work') detail+='\\n\\n【排程／管理方向補充】任務、進度、狀態或日期如果出現在第一版，修改後必須立即反映在清單與統計中。';
  return base+detail;
};
function renderResult(){`);

    // 新版暫存，避免舊版本狀態干擾。
    s=s.replace("var VERSION='2026.08.21-stable2'","var VERSION='2026.08.21-prompt-builder'" );
    s=s.replace("STORAGE='myverse_stable_v2'","STORAGE='myverse_prompt_builder_v1'" );

    document.open();
    document.write(s);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div><b>目前無法載入 MYVERSE</b><span>請重新整理頁面後再試一次。</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
