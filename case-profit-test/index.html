<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案子有賺嗎？｜接案利潤工具</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#303a38;font:16px system-ui,"Noto Sans TC",sans-serif}header{background:#254e48;color:white;padding:32px 18px}main{max-width:960px;margin:auto;padding:22px 16px}h1{margin:0;font-size:29px}h2{font-size:21px}.muted{opacity:.75;font-size:14px}.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 3px 20px #0001;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:600;font-size:14px}input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5d1;border-radius:10px;font-size:16px}button{background:#254e48;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#e4ede9;color:#254e48}button.danger{background:#a04444}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eaf2ed;padding:14px;border-radius:12px}.stat strong{display:block;font-size:23px;margin-top:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #eee;padding:14px 0;flex-wrap:wrap}.pill{color:#25594e;font-weight:700}#status{min-height:24px;color:#29614f}small{color:#63706a}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}h1{font-size:25px}}@media(max-width:370px){.grid{grid-template-columns:1fr}}</style><header><main style="padding:0 16px"><h1>案子有賺嗎？</h1><p>接案利潤與有效時薪，一眼看清楚。</p><span class="muted">測試版｜資料僅保存在目前瀏覽器，請定期備份</span></main></header><main><section class="panel"><h2>案件總覽</h2><div class="stats"><div class="stat">案件收入<strong id="sumRevenue">—</strong></div><div class="stat">扣除直接成本後<strong id="sumProfit">—</strong></div><div class="stat">整體有效時薪<strong id="sumHourly">—</strong></div></div></section><section class="panel"><h2 id="formTitle">新增案件</h2><form id="form"><div class="grid"><label>案件名稱<input id="name" required maxlength="100" placeholder="例如：海報設計"></label><label>案件收入（元）<input id="revenue" type="number" min="0" step=".01" required value="8000"></label><label>預估工時（小時）<input id="estimate" type="number" min="0" step=".25" value="20"></label><label>實際工時（小時）<input id="hours" type="number" min="0" step=".25" required value="35"></label><label>直接成本（元）<input id="cost" type="number" min="0" step=".01" value="1000"></label><label>其他成本（元）<input id="other" type="number" min="0" step=".01" value="500"></label><label>目標時薪（元）<input id="target" type="number" min="0" step=".01" value="400"></label></div><p><button type="submit" id="save">儲存案件</button><button type="button" class="secondary" id="reset">清空表單</button></p></form><p id="status" role="status"></p></section><section class="panel"><h2>我的案件</h2><div id="list"></div><p><button type="button" class="secondary" id="export">下載 JSON 備份</button><button type="button" class="secondary" id="importBtn">匯入 JSON 備份</button><input type="file" id="importFile" accept=".json,application/json" hidden></p><small>清除瀏覽器資料可能遺失紀錄；不同裝置不會自動同步。此工具提供估算，未計入所得稅及自身勞動報酬。</small></section></main><script>(()=>{"use strict";const key="caseprofit_v1",ids=["name","revenue","estimate","hours","cost","other","target"];let items=[],editing=null;const $=id=>document.getElementById(id),money=n=>"NT$"+Number(n||0).toLocaleString("zh-TW",{maximumFractionDigits:2}),num=x=>Number(x)||0;function load(){try{let v=JSON.parse(localStorage.getItem(key)||"[]");items=Array.isArray(v)?v:[]}catch(e){items=[]}}function persist(){try{localStorage.setItem(key,JSON.stringify(items));return true}catch(e){alert("無法保存，請檢查瀏覽器儲存空間");return false}}function escape(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function reset(){editing=null;$("form").reset();$("formTitle").textContent="新增案件";$("save").textContent="儲存案件";$("status").textContent=""}function render(){let revenue=0,profit=0,hours=0;for(const p of items){revenue+=num(p.revenue);profit+=num(p.revenue)-num(p.cost)-num(p.other);hours+=num(p.hours)}$("sumRevenue").textContent=money(revenue);$("sumProfit").textContent=money(profit);$("sumHourly").textContent=hours?money(profit/hours):"尚無工時";$("list").innerHTML=items.length?items.map(p=>{let net=num(p.revenue)-num(p.cost)-num(p.other),h=num(p.hours),target=num(p.target),quote=h*target+num(p.cost)+num(p.other);return '<div class="row"><div><b>'+escape(p.name)+'</b><br><small>收入 '+money(p.revenue)+'｜成本 '+money(num(p.cost)+num(p.other))+'｜實際 '+h+' 小時</small><br><span class="pill">可分配金額 '+money(net)+'｜有效時薪 '+(h?money(net/h):"無法計算")+'</span><br><small>下次參考報價 '+money(quote)+'｜預估與實際差 '+(h-num(p.estimate)).toFixed(2)+' 小時</small></div><div><button class="secondary" data-edit="'+escape(p.id)+'">編輯</button><button class="danger" data-delete="'+escape(p.id)+'">刪除</button></div></div>'}).join(""):"<p>尚未建立案件，從上方新增第一筆吧。</p>"}$("form").addEventListener("submit",e=>{e.preventDefault();const p={id:editing||String(Date.now())+Math.random().toString(36).slice(2)};for(const id of ids){p[id]=id==="name"?$(id).value.trim():Number($(id).value)}if(!p.name){$("status").textContent="請輸入案件名稱";return}if(ids.slice(1).some(id=>!Number.isFinite(p[id])||p[id]<0)){$("status").textContent="金額與工時不可為負數";return}const old=items.slice();if(editing){items=items.map(x=>x.id===editing?p:x)}else items.unshift(p);if(!persist()){items=old;return}reset();render();$("status").textContent="已儲存"});$("reset").onclick=reset;$("list").addEventListener("click",e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;const p=items.find(x=>x.id===id);if(!p)return;if(e.target.dataset.edit){editing=id;for(const k of ids)$(k).value=p[k];$("formTitle").textContent="編輯案件";$("save").textContent="儲存修改";window.scrollTo({top:0,behavior:"smooth"})}else if(confirm("確定刪除「"+p.name+"」？")){let old=items.slice();items=items.filter(x=>x.id!==id);if(!persist())items=old;render()}});$("export").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,items},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="案子有賺嗎-備份.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:data.items;if(!Array.isArray(arr)||arr.length>10000||!arr.every(p=>p&&typeof p.id==="string"&&typeof p.name==="string"&&ids.slice(1).every(k=>Number.isFinite(Number(p[k]))&&Number(p[k])>=0)))throw Error("格式錯誤");if(!confirm("匯入會覆蓋目前所有案件，確定繼續？"))return;const old=items.slice();items=arr.map(p=>Object.fromEntries(["id",...ids].map(k=>[k,k==="id"||k==="name"?String(p[k]):Number(p[k])])));if(!persist())items=old;render();alert("匯入完成")}catch(err){alert("匯入失敗："+err.message)}finally{e.target.value=""}};load();render()})();</script></html>
