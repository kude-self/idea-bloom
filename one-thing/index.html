<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f3eb"><title>一件事｜把你已經有的，做成真的</title><style>
:root{--bg:#f8f3eb;--paper:#fffdf9;--ink:#30342f;--muted:#777b74;--green:#718777;--green2:#edf2ed;--peach:#e7b6a1;--peach2:#faeee7;--line:#dfd9cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}.wrap{width:min(calc(100% - 34px),720px);margin:auto;padding:18px 0 120px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0 14px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.mark{width:32px;height:32px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center}.menu{display:flex;gap:4px}.menu button,.link{border:0;background:transparent;color:var(--muted);padding:8px;font:inherit;cursor:pointer}h1{font-size:clamp(30px,8vw,42px);line-height:1.24;letter-spacing:-.035em;margin:12px 0}h2{font-size:22px;margin:8px 0}.lead{font-size:16px;color:#565b55}.hero{padding:25px 0}.kicker{font-size:12px;letter-spacing:.1em;color:var(--green);font-weight:800}.btn{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--green);color:white;font-weight:750;font-size:16px;padding:14px 16px;margin:7px 0;cursor:pointer}.btn.alt{background:var(--peach2);color:#795f53;border:1px solid #e6c7b9}.btn.light{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:20px;margin:14px 0}.stepcard{position:relative;overflow:hidden;background:#fffaf5;border:1px solid #e5d7ca;border-radius:24px;padding:22px;margin:16px 0}.stepcard:after{content:"";position:absolute;right:-22px;top:-28px;width:72px;height:72px;border-radius:24px;background:#f1d4c5;transform:rotate(16deg)}.tag{display:inline-block;background:var(--green2);color:var(--green);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}.tip{background:var(--peach2);border:1px dashed #dec3b5;border-radius:14px;padding:13px 14px;margin:15px 0}.progress{display:flex;gap:5px;margin:12px 0 22px}.progress i{height:7px;flex:1;border-radius:9px;background:#dedbd3}.progress i.on{background:var(--green)}.return{display:grid;gap:9px}.return button{display:grid;grid-template-columns:1fr auto;text-align:left;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:15px;padding:14px;color:var(--ink);font:inherit}.return b,.return small{display:block}.return small{color:var(--muted);font-size:12px}.field{width:100%;min-height:150px;border:1px solid var(--line);border-radius:15px;padding:14px;font:inherit;background:white}.nav{position:sticky;bottom:72px;display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;background:rgba(255,253,249,.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 10px 30px #554c4018;margin-top:22px}.nav>button{border:0;border-radius:12px;min-height:45px;font-weight:700}.nav .next{background:var(--green);color:white}.nav .prev{background:#f0ece4;color:var(--ink)}.nav .mid{text-align:center}.nav .mid b{display:block;font-size:12px;color:var(--muted)}.nav .mid button{border:0;background:transparent;color:#aa725f;font-size:11px}.note{font-size:13px;color:var(--muted)}.hidden{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#30342f;color:white;border-radius:99px;padding:10px 15px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);background:var(--paper);border-radius:17px;padding:16px;text-align:left;min-height:92px}.choice b{display:block}.choice small{color:var(--muted)}@media(max-width:560px){.menu button{font-size:12px;padding:6px}.grid{grid-template-columns:1fr}.nav{bottom:76px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const K="one-thing:v1";const steps=[["看看，我已經有什麼","先不要想產品。從你真正做過、學過、解決過的事情開始。","《我已經有的東西》"],["只選一件值得做的","不是再想更多，而是把不適合現在做的先放掉。","《這次，我們只做這一件》"],["整理成別人真的能用的東西","把想法整理成另一個人能真正使用的第一版。","《這個產品，我們已經決定的事 V1》"],["把第一版做出來","停止繼續發想，開始完成真正可以使用的版本。","《第一版完成紀錄》"],["先別急著說完成","用第一次使用、真的付錢、專門挑錯三個角度檢查。","《可以交出去之前的最後檢查》"],["把它交給第一個人","不用盛大上市，先準備好交給第一個真正需要的人。","《第一批，準備交出去》"]];
const rules="請全程使用台灣繁體中文。目標不是產生最多想法，而是把一件事情做完整。優先使用目前對話已有資訊；能合理判斷就直接判斷；缺少重要資訊時一次最多問 1–3 個簡單問題；不要求使用者懂產品、商業、設計、程式或 Prompt；不為鼓勵而把每個想法都說有市場；不適合可直接淘汰；不因 AI 做得到就代表產品需要；第一版以真的能被使用為優先；不自行推翻已確認決定；沒有實際確認就不宣稱完成；不提前執行下一階段。";
const ps=[`從我已經有的開始，整理我做過的工作、專案、興趣、學過的東西、反覆處理的問題、替自己或別人解決過的問題、做過的工具/內容/流程。分成 A我很熟 B我真的做過 C能替別人解決問題 D可能整理成產品。資訊不足最多問3個簡單問題。最後建立《我已經有的東西》，留下最多5個真正有產品可能性的材料。現在不要決定產品。`,`接續《我已經有的東西》。不要增加更多方向，只做減少。判斷候選方向的真實能力來源、誰需要、具體問題、能省下什麼、最後得到什麼、最小第一版、付費理由與風險。淘汰弱方向，最多留3個，最後直接推薦現在最值得先完成的一件，不把決定丟回給我。建立《這次，我們只做這一件》。`,`接續《這次，我們只做這一件》，不要重新發想。整理給誰、真實情境、想完成什麼、產品負責哪一段、怎麼使用、實際交付、最適合形式，以及第一版一定需要/以後可以有/現在不要做。最後建立《這個產品，我們已經決定的事 V1》，包含名稱、客群、解決與不解決、核心結果、形式、流程、交付物、V1內容、不要做、完成標準。這份成為後續產品基準。`,`停止產品發想。依照《這個產品，我們已經決定的事 V1》開始完成真正可交給別人使用的第一版。先判斷目前環境能直接完成什麼；能做就直接做，不只給做法；做不到要清楚說明需要什麼工具，不得假裝完成。不擴大第一版、不增加無關功能。完成後建立《第一版完成紀錄》：✓已真正完成/△需人工確認/×尚未完成。規劃不算完成。`,`不要新增功能，也不要預設完成。以第一次看到的人、真的付錢的人、專門挑錯的人三個角色檢查。找出看不懂、卡住、承諾不一致、不能用、錯誤、遺漏、死連結、假功能、手機、資料、空白與錯誤狀態問題。能實測就測，不能測標示需要人工確認。建立《可以交出去之前的最後檢查》並分 ✓/△/×。`,`接續已完成且檢查過的第一版。不要做行銷課，替我準備第一次真正交付：一句話說明、適合誰、為什麼需要、會拿到什麼、最簡使用方式、合理價格建議、第一批人數、短版/完整版介紹、社群貼文、限動、私訊介紹、歡迎訊息、第一次使用說明、回饋問題。避免誇大。最後建立《第一批，準備交出去》，並只給我一個最小下一步。`];
let d;try{d=JSON.parse(localStorage.getItem(K))||{step:1,results:{},name:"",base:""}}catch(e){d={step:1,results:{},name:"",base:""}}function save(){localStorage.setItem(K,JSON.stringify(d))}function toast(x){let t=document.querySelector("#toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}function copy(x){navigator.clipboard?.writeText(x).then(()=>toast("✓ 已複製")).catch(()=>prompt("請複製以下內容",x))}function promptFor(n){let ctx=Object.entries(d.results).map(([k,v])=>"【前一步結果】\n"+v).join("\n\n");return rules+"\n\n"+ctx+"\n\n【現在只做第 "+n+" 步】\n"+ps[n-1]}
function shell(x){return '<main class="wrap"><header class="top"><div class="brand"><span class="mark">一</span>一件事</div><div class="menu"><button onclick="home()">首頁</button><button onclick="product()">我的產品</button><button onclick="settings()">設定</button></div></header>'+x+'</main>'}
function home(){app.innerHTML=shell('<section class="hero"><span class="kicker">把你已經有的，做成真的。</span><h1>不用再想更多。<br>先把一件事做出來。</h1><p class="lead">從你做過、學過、解決過的事情裡，找出一件值得整理的東西，陪你一步一步做到能真正交出去。</p><button class="btn" onclick="step('+d.step+')">'+(Object.keys(d.results).length?"繼續我的這一件事":"開始看看")+' →</button><p class="note">不用先想好要做什麼，也不需要會寫 Prompt。</p></section><div class="grid"><div class="card"><b>01 找到</b><p class="note">看見你已經有的材料</p></div><div class="card"><b>02 做出來</b><p class="note">把一件事整理成第一版</p></div><div class="card"><b>03 交出去</b><p class="note">準備給第一個真正需要的人</p></div><div class="card"><b>之後也能照顧</b><p class="note">修改、修復與下一版本都有基準</p></div></div>')}
function journey(n){return '<nav class="nav"><button class="prev" '+(n===1?"disabled":"")+' onclick="step('+(n-1)+')">← 上一步</button><div class="mid"><b>'+n+' / 6</b><button onclick="restart()">重新開始</button></div><button class="next" '+(n===6?"disabled":"")+' onclick="next('+(n+1)+')">下一步 →</button></nav>'}
function step(n){d.step=n;save();let s=steps[n-1];app.innerHTML=shell('<div class="kicker">現在進行 · '+String(n).padStart(2,"0")+' / 06</div><div class="progress">'+steps.map((_,i)=>'<i class="'+(i<n?"on":"")+'"></i>').join("")+'</div><section class="stepcard"><span class="tag">STEP '+String(n).padStart(2,"0")+'</span><h1>'+s[0]+'</h1><p class="lead">'+s[1]+'</p><div class="tip"><b>這一步只做一件事</b><br>先完成現在這一步，不用急著處理後面。</div><p class="note">完成後，你會留下</p><h2>'+s[2]+'</h2><button class="btn" onclick="copy(promptFor('+n+'))">複製這一步的指令</button><button class="btn alt" onclick="window.open(\'https://chatgpt.com/\',\'_blank\')">打開 ChatGPT →</button><p class="note">完整指令不會顯示在頁面上。</p></section><section class="card"><span class="kicker">帶回這一步</span><h2>你現在是哪一種情況？</h2><p class="note">不用判斷「做完了沒」，選最接近的就好。</p><div class="return"><button onclick="result('+n+')"><span><b>我拿到結果了</b><small>有內容可以留下來</small></span>→</button><button onclick="rescue('+n+')"><span><b>AI 卡住了</b><small>幫我整理救援方式</small></span>→</button><button onclick="rescue('+n+')"><span><b>我不確定這是不是結果</b><small>請 AI 檢查還缺什麼</small></span>→</button></div></section>'+journey(n))}
function result(n){app.innerHTML=shell('<span class="kicker">第 '+n+' 步</span><h1>把這一步帶回來</h1><div class="card"><p><b>你現在手上有什麼？</b></p><p class="note">有文字就貼回來；沒有也不用硬填。</p><textarea id="r" class="field" placeholder="有的話，貼上 '+steps[n-1][2]+'">'+(d.results[n]||"")+'</textarea><button class="btn" onclick="saveResult('+n+')">保存這份結果並繼續</button>'+(n!==3?'<button class="btn light" onclick="skip('+n+')">沒有文字可以貼，但這一步已處理</button>':'<p class="note">第 3 步是後續修改的產品基準，需要至少留下一份實際內容。</p>')+'<button class="btn alt" onclick="rescue('+n+')">我現在什麼都沒有</button></div>'+journey(n))}
function saveResult(n){let v=document.querySelector("#r").value.trim();if(!v)return toast("先貼上內容");d.results[n]=v;if(n===3)d.base=v;d.step=Math.min(6,n+1);save();n===6?product():step(n+1)}function skip(n){d.step=Math.min(6,n+1);save();n===6?product():step(n+1)}function rescue(n){copy(rules+"\n\n我正在第 "+n+" 步："+steps[n-1][0]+"。請停止延伸或進入下一步，直接依照目前對話已有資訊，把這一步真正完成，最後明確建立 "+steps[n-1][2]+"。如果資訊真的不足，最多問我 1–3 個簡單問題。");toast("已複製救援指令")}
function next(n){if(n===4&&!d.results[3])return toast("先留下第 3 步的產品基準");step(n)}function restart(){if(confirm("重新開始六步旅程？\n已保存的備份不會自動刪除。")){d={step:1,results:{},name:"",base:""};save();step(1)}}
function product(){app.innerHTML=shell('<span class="kicker">我的產品</span><h1>'+(d.name||"你的一件事")+'</h1><div class="card"><h2>目前進度</h2><p>已留下 '+Object.keys(d.results).length+' / 6 個階段結果。</p><p class="note">'+(d.base?"產品基準已保存，可以用它保護後續修改。":"完成第 3 步後，會建立產品基準。")+'</p></div><div class="card"><h2>產品照顧箱</h2><div class="grid"><button class="choice" onclick="care(\'edit\')"><b>小修改</b><small>只改指定地方</small></button><button class="choice" onclick="care(\'add\')"><b>想增加</b><small>先判斷值不值得加</small></button><button class="choice" onclick="care(\'broken\')"><b>需要修復</b><small>先修，不重做</small></button><button class="choice" onclick="care(\'v2\')"><b>下一版本</b><small>整理真正值得改的事</small></button></div></div>')}
function care(t){let q=prompt("用平常說話的方式告訴我，你想處理什麼：");if(!q)return;let task=t==="edit"?"只處理我指定的修改，不要重做產品。":t==="add"?"先判斷這個新增是否真的需要；只有值得現在加入才給最小修改方式。":t==="broken"?"進入修復模式：找原因、最小修復、重新檢查受影響功能，不要重做。":"先整理一定要修、值得加入、可以等等、不要做，在我確認前不要大改。";copy((d.base?"【目前產品基準】\n"+d.base+"\n\n":"")+task+"\n我的情況："+q+"\n\n"+rules)}
function settings(){app.innerHTML=shell('<h1>設定</h1><div class="card"><h2>資料保存在這台裝置</h2><p class="note">清除瀏覽器資料可能讓內容消失，重要內容請備份。</p><button class="btn light" onclick="backup()">下載備份</button><button class="btn light" onclick="document.querySelector(\'#file\').click()">還原備份</button><input id="file" type="file" accept=".json" hidden onchange="restore(this.files[0])"></div><div class="card"><h2>清除資料</h2><button class="btn alt" onclick="clearAll()">清除所有資料</button></div>')}
function backup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.href=u;a.download="一件事-備份.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function restore(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.results)throw 0;if(confirm("用這份備份取代目前資料？")){d=x;save();home()}}catch(e){alert("這不是可辨識的備份檔")}};r.readAsText(f)}function clearAll(){if(prompt("輸入「刪除」確認")==="刪除"){localStorage.removeItem(K);d={step:1,results:{},name:"",base:""};home()}}home();
</script></body></html>
