<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學習日誌｜課程與學員管理</title><style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#243027;--muted:#758078;--line:#e3e8e2;--accent:#6f8d76;--soft:#edf3ee;--danger:#a65353}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#f6f7f4ee;border-bottom:1px solid var(--line)}.topin{max-width:1100px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;overflow:auto}.nav button{border:0;background:transparent;padding:9px 11px;border-radius:10px;color:var(--muted);white-space:nowrap}.nav button.active{background:var(--soft);color:var(--accent);font-weight:800}main{max-width:1100px;margin:auto;padding:20px 16px 50px}.view{display:none}.view.active{display:block}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card,.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:16px}.card,.panel{padding:18px}.panel{margin-top:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);padding:14px;border-radius:13px}.stat b{display:block;font-size:24px}.actions,.toolbar,.cardactions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.soft{background:var(--soft);color:var(--accent);border-color:transparent}.btn.danger{color:var(--danger)}.toolbar{margin:14px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}.toolbar input{flex:1;min-width:180px}.list{display:grid;gap:10px}.item{padding:14px}.name{font-weight:800;font-size:18px}.muted{color:var(--muted)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#f0f2ef}.progress{height:8px;background:#edf0ed;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}.field{display:grid;gap:6px}.field textarea{min-height:90px}.overlay{position:fixed;inset:0;background:#24302766;z-index:30;display:none;padding:16px;overflow:auto}.overlay.open{display:flex}.sheet{background:#fff;width:min(700px,100%);margin:auto;border-radius:16px;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}.x{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px}.error{display:none;color:var(--danger);font-size:12px}.error.show{display:block}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.history{display:grid;gap:8px;margin-top:12px}.history .item{background:#fafbf9}@media(max-width:760px){.topin{align-items:flex-start;flex-direction:column}.nav{width:100%}.hero,.grid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1;min-width:0}.toolbar .btn{width:100%}}
</style></head><body><header class="top"><div class="topin"><div class="brand">學習日誌<small>課程與學員管理</small></div><nav class="nav"><button class="active" data-view="dash">總覽</button><button data-view="students">學員</button><button data-view="records">上課紀錄</button></nav></div></header><main>
<section id="dash" class="view active"><div class="hero"><div class="card"><h1>把每位學員的學習歷程整理在一起。</h1><p class="muted">適合個人講師、家教老師與小型課程帶領者。</p><div class="actions"><button id="addStudentDash" class="btn primary">＋新增學員</button><button id="addRecordDash" class="btn soft">＋新增上課紀錄</button></div></div><div class="card"><div class="stats"><div class="stat">學員總數<b id="sTotal">0</b></div><div class="stat">進行中<b id="sActive">0</b></div><div class="stat">本月上課<b id="sMonth">0</b></div><div class="stat">平均進度<b id="sAvg">0%</b></div></div></div></div><div class="panel"><h2>最近上課</h2><div id="recent" class="list"></div></div></section>
<section id="students" class="view"><div class="panel"><div class="actions" style="justify-content:space-between"><h2>學員資料</h2><button id="addStudent" class="btn primary">＋新增學員</button></div><div class="toolbar"><input id="studentSearch" placeholder="搜尋姓名、課程、聯絡方式"><select id="studentCourse"><option value="">全部課程／班別</option></select><select id="studentStatus"><option value="">全部狀態</option><option>進行中</option><option>暫停</option><option>已完成</option></select><button id="resetStudents" class="btn">重設</button></div><div id="studentList" class="list"></div></div></section>
<section id="records" class="view"><div class="panel"><div class="actions" style="justify-content:space-between"><h2>上課紀錄</h2><button id="addRecord" class="btn primary">＋新增紀錄</button></div><div class="toolbar"><input id="recordSearch" placeholder="搜尋學員、作業、回饋"><select id="recordStudent"><option value="">全部學員</option></select><button id="resetRecords" class="btn">重設</button></div><div id="recordList" class="list"></div></div></section>
</main>
<div id="studentModal" class="overlay"><div class="sheet"><div class="sheethead"><h2 id="studentTitle">新增學員</h2><button id="closeStudent" class="x">✕</button></div><form id="studentForm" novalidate><input type="hidden" id="studentId"><div class="grid"><div class="field"><label>姓名 *</label><input id="fName"><span id="eName" class="error">請輸入姓名</span></div><div class="field"><label>聯絡方式</label><input id="fContact"></div><div class="field"><label>課程／班別 *</label><input id="fCourse"><span id="eCourse" class="error">請輸入課程／班別</span></div><div class="field"><label>狀態</label><select id="fStatus"><option>進行中</option><option>暫停</option><option>已完成</option></select></div><div class="field"><label>開始日期</label><input id="fStart" type="date"></div><div class="field"><label>整體進度 0–100</label><input id="fProgress" type="number" min="0" max="100" value="0"><span id="eProgress" class="error">請輸入 0～100</span></div><div class="field span2"><label>備註</label><textarea id="fNote"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">儲存學員</button><button id="cancelStudent" class="btn" type="button">取消</button></div></form></div></div>
<div id="recordModal" class="overlay"><div class="sheet"><div class="sheethead"><h2 id="recordTitle">新增上課紀錄</h2><button id="closeRecord" class="x">✕</button></div><form id="recordForm" novalidate><input type="hidden" id="recordId"><div class="grid"><div class="field"><label>學員 *</label><select id="rStudent"><option value="">請選擇</option></select><span id="erStudent" class="error">請選擇學員</span></div><div class="field"><label>上課日期 *</label><input id="rDate" type="date"><span id="erDate" class="error">請選擇日期</span></div><div class="field"><label>課程／班別 *</label><input id="rCourse"><span id="erCourse" class="error">請輸入課程／班別</span></div><div class="field"><label>本次後進度 0–100 *</label><input id="rProgress" type="number" min="0" max="100"><span id="erProgress" class="error">請輸入 0～100</span></div><div class="field span2"><label>學習內容／進度</label><textarea id="rLesson"></textarea></div><div class="field span2"><label>作業</label><textarea id="rHomework"></textarea></div><div class="field span2"><label>回饋</label><textarea id="rFeedback"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">儲存紀錄</button><button id="cancelRecord" class="btn" type="button">取消</button></div></form></div></div>
<div id="historyModal" class="overlay"><div class="sheet"><div class="sheethead"><h2 id="historyTitle">學員歷史</h2><button id="closeHistory" class="x">✕</button></div><div id="historyBody"></div></div></div>
<script>(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),KS='cm_students_v1',KR='cm_records_v1';let S=[],R=[];try{S=JSON.parse(localStorage.getItem(KS)||'[]');R=JSON.parse(localStorage.getItem(KR)||'[]')}catch{}const save=()=>{try{localStorage.setItem(KS,JSON.stringify(S));localStorage.setItem(KR,JSON.stringify(R))}catch{}};if(!S.length){S=[{id:'s1',name:'林沐晨',contact:'LINE：muchen',course:'基礎插畫 A 班',status:'進行中',start:'2026-07-05',progress:65,note:'加強人物比例與構圖'},{id:'s2',name:'陳安禾',contact:'anhe@example.com',course:'品牌內容寫作',status:'進行中',start:'2026-07-18',progress:40,note:'以 IG 貼文與短影音腳本為主'},{id:'s3',name:'周予晴',contact:'0912-345-678',course:'基礎插畫 A 班',status:'已完成',start:'2026-05-10',progress:100,note:'已完成期末作品'}];R=[{id:'r1',studentId:'s1',date:'2026-08-18',course:'基礎插畫 A 班',progress:65,lesson:'人物頭身比例與雙人構圖',homework:'完成 2 張雙人構圖草稿',feedback:'比例掌握更穩定'},{id:'r2',studentId:'s2',date:'2026-08-16',course:'品牌內容寫作',progress:40,lesson:'受眾問題與開頭鉤子',homework:'完成 2 篇短貼文',feedback:'下一步加強段落節奏與 CTA'}];save()}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),stud=id=>S.find(x=>x.id===id),open=e=>e.classList.add('open'),close=e=>e.classList.remove('open'),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function opts(){const courses=[...new Set(S.map(x=>x.course))];$('#studentCourse').innerHTML='<option value="">全部課程／班別</option>'+courses.map(x=>`<option>${esc(x)}</option>`).join('');$('#recordStudent').innerHTML='<option value="">全部學員</option>'+S.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#rStudent').innerHTML='<option value="">請選擇</option>'+S.map(x=>`<option value="${x.id}">${esc(x.name)}｜${esc(x.course)}</option>`).join('')}function dash(){const ym=today().slice(0,7);$('#sTotal').textContent=S.length;$('#sActive').textContent=S.filter(x=>x.status==='進行中').length;$('#sMonth').textContent=R.filter(x=>x.date.startsWith(ym)).length;$('#sAvg').textContent=(S.length?Math.round(S.reduce((a,b)=>a+Number(b.progress||0),0)/S.length):0)+'%';$('#recent').innerHTML=R.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(r=>{const s=stud(r.studentId);return `<div class="item"><b>${esc(r.date)}</b>・${esc(s?s.name:'已刪除學員')}<div class="muted">${esc(r.course)}｜${r.progress}%</div></div>`}).join('')||'<div class="empty">尚無紀錄</div>'}function students(){opts();const q=$('#studentSearch').value.toLowerCase(),c=$('#studentCourse').value,st=$('#studentStatus').value;const a=S.filter(x=>(!q||[x.name,x.contact,x.course,x.note].join(' ').toLowerCase().includes(q))&&(!c||x.course===c)&&(!st||x.status===st));$('#studentList').innerHTML=a.map(x=>`<div class="item"><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.course)}${x.contact?'・'+esc(x.contact):''}</div><div class="meta"><span class="badge">${esc(x.status)}</span><span class="badge">${R.filter(r=>r.studentId===x.id).length} 次紀錄</span></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,x.progress))}%"></i></div><div class="cardactions" style="margin-top:10px"><button class="btn soft" data-history="${x.id}">查看歷史</button><button class="btn" data-addrecord="${x.id}">新增紀錄</button><button class="btn" data-editstudent="${x.id}">編輯</button><button class="btn danger" data-delstudent="${x.id}">刪除</button></div></div>`).join('')||'<div class="empty">沒有符合條件的學員</div>'}function records(){opts();const q=$('#recordSearch').value.toLowerCase(),sid=$('#recordStudent').value;const a=R.filter(r=>{const s=stud(r.studentId);return(!q||[s?s.name:'',r.course,r.lesson,r.homework,r.feedback].join(' ').toLowerCase().includes(q))&&(!sid||r.studentId===sid)}).sort((a,b)=>b.date.localeCompare(a.date));$('#recordList').innerHTML=a.map(r=>{const s=stud(r.studentId);return `<div class="item"><b>${esc(r.date)}</b>・${esc(s?s.name:'已刪除學員')}<div class="muted">${esc(r.course)}｜${r.progress}%</div><div class="history"><div><b>學習：</b>${esc(r.lesson||'未填寫')}</div><div><b>作業：</b>${esc(r.homework||'未填寫')}</div><div><b>回饋：</b>${esc(r.feedback||'未填寫')}</div></div><div class="cardactions" style="margin-top:10px"><button class="btn" data-editrecord="${r.id}">編輯</button><button class="btn danger" data-delrecord="${r.id}">刪除</button></div></div>`}).join('')||'<div class="empty">沒有符合條件的紀錄</div>'}function all(){dash();students();records()}function showView(id){$$('.view').forEach(v=>v.classList.toggle('active',v.id===id));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));id==='dash'?dash():id==='students'?students():records()}$$('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));function studentForm(id=''){const f=$('#studentForm');f.reset();$('#studentId').value=id;$('#fProgress').value=0;$('#studentTitle').textContent=id?'編輯學員':'新增學員';if(id){const x=stud(id);$('#fName').value=x.name;$('#fContact').value=x.contact||'';$('#fCourse').value=x.course;$('#fStatus').value=x.status;$('#fStart').value=x.start||'';$('#fProgress').value=x.progress;$('#fNote').value=x.note||''}open($('#studentModal'))}function recordForm(id='',sid=''){opts();$('#recordForm').reset();$('#recordId').value=id;$('#rDate').value=today();$('#recordTitle').textContent=id?'編輯上課紀錄':'新增上課紀錄';if(id){const x=R.find(r=>r.id===id);$('#rStudent').value=x.studentId;$('#rDate').value=x.date;$('#rCourse').value=x.course;$('#rProgress').value=x.progress;$('#rLesson').value=x.lesson||'';$('#rHomework').value=x.homework||'';$('#rFeedback').value=x.feedback||''}else if(sid){const s=stud(sid);$('#rStudent').value=s.id;$('#rCourse').value=s.course;$('#rProgress').value=s.progress}open($('#recordModal'))}$('#studentForm').onsubmit=e=>{e.preventDefault();const name=$('#fName').value.trim(),course=$('#fCourse').value.trim(),p=Number($('#fProgress').value),okp=Number.isFinite(p)&&p>=0&&p<=100;$('#eName').classList.toggle('show',!name);$('#eCourse').classList.toggle('show',!course);$('#eProgress').classList.toggle('show',!okp);if(!name||!course||!okp)return;const id=$('#studentId').value||uid(),x={id,name,contact:$('#fContact').value.trim(),course,status:$('#fStatus').value,start:$('#fStart').value,progress:p,note:$('#fNote').value.trim()},i=S.findIndex(s=>s.id===id);i>=0?S[i]=x:S.unshift(x);save();close($('#studentModal'));all()};$('#recordForm').onsubmit=e=>{e.preventDefault();const sid=$('#rStudent').value,date=$('#rDate').value,course=$('#rCourse').value.trim(),p=Number($('#rProgress').value),okp=Number.isFinite(p)&&p>=0&&p<=100;$('#erStudent').classList.toggle('show',!sid);$('#erDate').classList.toggle('show',!date);$('#erCourse').classList.toggle('show',!course);$('#erProgress').classList.toggle('show',!okp);if(!sid||!date||!course||!okp)return;const id=$('#recordId').value||uid(),x={id,studentId:sid,date,course,progress:p,lesson:$('#rLesson').value.trim(),homework:$('#rHomework').value.trim(),feedback:$('#rFeedback').value.trim()},i=R.findIndex(r=>r.id===id);i>=0?R[i]=x:R.unshift(x);const s=stud(sid);if(s){s.progress=p;s.course=course;if(p>=100&&s.status==='進行中')s.status='已完成'}save();close($('#recordModal'));all()};$('#rStudent').onchange=()=>{if(!$('#recordId').value){const s=stud($('#rStudent').value);if(s){$('#rCourse').value=s.course;$('#rProgress').value=s.progress}}};$('#studentList').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.history){const s=stud(b.dataset.history),rs=R.filter(r=>r.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date));$('#historyTitle').textContent=s.name+'｜學習歷史';$('#historyBody').innerHTML=`<p><b>${esc(s.course)}</b>｜${esc(s.status)}｜${s.progress}%</p><div class="history">${rs.map(r=>`<div class="item"><b>${esc(r.date)}</b><div>${esc(r.lesson||'未填寫')}</div><div class="muted">作業：${esc(r.homework||'未填寫')}</div><div class="muted">回饋：${esc(r.feedback||'未填寫')}</div></div>`).join('')||'<div class="empty">尚無紀錄</div>'}</div>`;open($('#historyModal'))}if(b.dataset.addrecord)recordForm('',b.dataset.addrecord);if(b.dataset.editstudent)studentForm(b.dataset.editstudent);if(b.dataset.delstudent){const s=stud(b.dataset.delstudent);if(confirm('確定刪除「'+s.name+'」？相關上課紀錄也會刪除。')){S=S.filter(x=>x.id!==s.id);R=R.filter(x=>x.studentId!==s.id);save();all()}}};$('#recordList').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.editrecord)recordForm(b.dataset.editrecord);if(b.dataset.delrecord){const r=R.find(x=>x.id===b.dataset.delrecord);if(confirm('確定刪除這筆上課紀錄？')){R=R.filter(x=>x.id!==r.id);save();all()}}};$('#addStudent').onclick=$('#addStudentDash').onclick=()=>studentForm();$('#addRecord').onclick=$('#addRecordDash').onclick=()=>recordForm();$('#studentSearch').oninput=students;$('#studentCourse').onchange=students;$('#studentStatus').onchange=students;$('#recordSearch').oninput=records;$('#recordStudent').onchange=records;$('#resetStudents').onclick=()=>{$('#studentSearch').value='';$('#studentCourse').value='';$('#studentStatus').value='';students()};$('#resetRecords').onclick=()=>{$('#recordSearch').value='';$('#recordStudent').value='';records()};$('#closeStudent').onclick=$('#cancelStudent').onclick=()=>close($('#studentModal'));$('#closeRecord').onclick=$('#cancelRecord').onclick=()=>close($('#recordModal'));$('#closeHistory').onclick=()=>close($('#historyModal'));[$('#studentModal'),$('#recordModal'),$('#historyModal')].forEach(m=>m.onclick=e=>{if(e.target===m)close(m)});all()})();</script></body></html>
