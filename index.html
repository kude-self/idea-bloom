<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MYVERSE｜我的世界創造器</title>
<style>
:root{--ink:#453d3b;--muted:#8e817d;--line:#eadbd5;--paper:#fffdfb;--pink:#f8dfdc;--mint:#e4f0e5;--blue:#e7f0f7;--yellow:#fff1c7;--lav:#eee7f6;--berry:#c97f78}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff9f4,#fff5ee);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:760px;margin:auto;padding:14px 10px 72px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}.reset{border:0;background:none;text-decoration:underline;color:var(--muted);min-height:44px}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.progress i{height:5px;border-radius:99px;background:#eee4de}.progress i.on{background:var(--berry)}.card{display:none;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:22px 17px}.card.active{display:block}.eyebrow{font-size:11px;color:var(--berry);font-weight:800}h1,h2{line-height:1.45;margin:5px 0 8px}p{color:#6f6460;line-height:1.7}.ideas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.idea{border:1px solid var(--line);border-radius:19px;padding:14px;text-align:left;min-height:92px;color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation}.idea:nth-child(1){background:var(--pink)}.idea:nth-child(2){background:var(--mint)}.idea:nth-child(3){background:var(--blue)}.idea:nth-child(4){background:var(--yellow)}.idea:nth-child(5){background:var(--lav);grid-column:1/-1;min-height:78px}.idea b{display:block;font-size:15px}.idea small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}.idea.on{outline:2px solid var(--berry)}.field{margin:15px 0}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}.hint{font-size:11px;color:var(--muted);font-weight:400}textarea,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink)}textarea{min-height:110px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 11px;font:inherit;cursor:pointer}.chip.on{background:var(--pink)}.nav,.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:8px;margin-top:18px}.btn{border:0;border-radius:17px;min-height:50px;padding:12px;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}.primary{background:linear-gradient(135deg,#d9958b,#c97f78);color:white}.outline{background:white;border:1px solid var(--line)}.result{background:#352f2d;color:#fff8f2;border-radius:17px;padding:15px;white-space:pre-wrap;line-height:1.72;font-size:12.5px;max-height:580px;overflow:auto}.guide{margin-top:16px;background:#fff8e9;border:1px solid #eadcc8;border-radius:18px;padding:13px}.error{display:none;background:#fde8e5;color:#9b544d;padding:9px;border-radius:12px}.error.show{display:block}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#302b29;color:white;padding:9px 13px;border-radius:99px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}@media(max-width:620px){.actions{grid-template-columns:1fr}.card{padding:19px 13px}.ideas{gap:7px}.idea{min-height:100px;padding:12px}.idea:nth-child(5){min-height:78px}.brand small{display:none}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">✦ MYVERSE｜我的世界創造器<small>一個想法，創造你的世界。</small></div><button class="reset" id="reset" type="button">重新開始</button></header>
<div class="progress"><i class="on"></i><i></i><i></i></div>
<section class="card active" id="s1">
<div class="eyebrow">第 1 步｜選擇方向</div><h1>今天，你想創造什麼？</h1><p>選一個方向，或直接用「自由創作」說出你的想法。</p>
<div class="ideas" id="ideas"></div>
<div class="field"><label>你的想法</label><textarea id="idea" placeholder="把你真正想做的東西寫在這裡。"></textarea></div>
<div class="error" id="e1"></div><button class="btn primary" id="to2" type="button" style="width:100%">繼續整理 ✦</button>
</section>
<section class="card" id="s2">
<div class="eyebrow">第 2 步｜補上你的偏好</div><h2>只留下會影響成品的內容</h2>
<div class="field"><label>主要給誰使用？ <span class="hint">可留白</span></label><input id="who" placeholder="例如：我自己／客人／工作室"></div>
<div class="field"><label>其他一定要有的需求 <span class="hint">可留白</span></label><textarea id="extra" placeholder="例如：手機版優先、字體大一點、一定要能搜尋。"></textarea></div>
<div class="field"><label>想要的風格</label><div class="chips"><button class="chip" type="button">溫暖</button><button class="chip" type="button">可愛</button><button class="chip" type="button">簡約</button><button class="chip" type="button">專業</button><button class="chip" type="button">自然</button><button class="chip" type="button">高級</button></div></div>
<div class="nav"><button class="btn outline" id="back" type="button">← 上一步</button><button class="btn primary" id="build" type="button">產生完整指令 ✦</button></div>
</section>
<section class="card" id="s3">
<div class="eyebrow">第 3 步｜完成</div><h2>你的完整 AI 製作指令</h2><p>整份複製貼給 AI，請它直接完成第一版。</p><pre class="result" id="result"></pre>
<div class="actions"><button class="btn primary" id="copy" type="button">複製完整指令</button><button class="btn outline" id="download" type="button">下載 TXT</button></div>
<div class="guide"><b>使用方式</b><p>如果 AI 只分析沒有直接製作，補一句：「請不要只給建議，直接依照這份需求完成第一版。」</p></div>
<button class="btn outline" id="edit" type="button" style="width:100%;margin-top:10px">← 回去修改</button>
</section>
</main><div class="toast" id="toast">已複製</div>
<script>
(function(){'use strict';
var type='',STORE='myverse_clean_v1';
var T={
booking:{title:'📅 預約單',desc:'服務、日期、時段與預約紀錄',idea:'我想做一個給客人使用的預約單，可以選擇服務、日期與時段，填寫基本資料；我自己可以查看、搜尋、修改與取消預約。',spec:'需要包含：預約填寫、服務項目、日期與時段、基本資料、預約清單、搜尋／篩選、修改／取消、狀態管理。'},
customer:{title:'♡ 客戶紀錄',desc:'客戶資料、歷史紀錄與搜尋',idea:'我想做一個客戶紀錄系統，可以保存每位客戶的基本資料、服務紀錄、日期與備註，並能搜尋客戶、查看歷史紀錄與編輯資料。',spec:'需要包含：客戶清單、搜尋／篩選、基本資料、單一客戶詳情、歷史紀錄、新增／編輯資料。'},
money:{title:'◫ 記帳工具',desc:'收入支出、分類與月份統計',idea:'我想做一個個人記帳工具，可以記錄收入與支出、分類、日期、金額和備註，並查看每月統計、搜尋紀錄與備份資料。',spec:'需要包含：收入／支出紀錄、新增／編輯／刪除、分類、月份統計、搜尋／篩選、資料備份與還原。'},
tasks:{title:'✓ 任務管理',desc:'任務、期限、狀態與進度',idea:'我想做一個個人任務管理工具，可以建立任務、設定日期、優先順序與完成狀態，並搜尋、篩選與查看目前進度。',spec:'需要包含：任務新增／編輯／刪除、日期與期限、優先順序、完成狀態、搜尋／篩選、進度統計。'},
free:{title:'✦ 自由創作',desc:'直接把你的想法變成製作指令',idea:'',spec:''}
};
function e(i){return document.getElementById(i)}function a(s){return [].slice.call(document.querySelectorAll(s))}
function show(n){['s1','s2','s3'].forEach(function(id,i){e(id).classList.toggle('active',i===n-1)});a('.progress i').forEach(function(x,i){x.classList.toggle('on',i<n)});window.scrollTo(0,0)}
function render(){e('ideas').innerHTML=Object.keys(T).map(function(k){var x=T[k];return '<button class="idea '+(type===k?'on':'')+'" type="button" data-type="'+k+'"><b>'+x.title+'</b><small>'+x.desc+'</small></button>'}).join('')}
function choose(k){type=k;e('idea').value=T[k].idea;e('idea').placeholder=k==='free'?'直接寫你真正想做的工具、網站、表單、紀錄系統或其他內容。':'可直接修改成你的版本。';render();save()}
function save(){try{localStorage.setItem(STORE,JSON.stringify({type:type,idea:e('idea').value,who:e('who').value,extra:e('extra').value,styles:a('.chip.on').map(function(x){return x.textContent})}))}catch(x){}}
function load(){try{var s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;type=s.type||'';e('idea').value=s.idea||'';e('who').value=s.who||'';e('extra').value=s.extra||'';a('.chip').forEach(function(c){c.classList.toggle('on',(s.styles||[]).indexOf(c.textContent)>-1)})}catch(x){}}
function prompt(){var free=type==='free',styles=a('.chip.on').map(function(c){return c.textContent}).join('、')||'清楚、好閱讀';var spec=free?'請先理解我描述的用途，自行補齊第一版真正需要的欄位、頁面、流程與功能；不要硬套固定模板。':T[type].spec;return '我要請你根據以下內容，直接幫我製作第一版。不要把需求擴張成另一個商業計畫，也不要替我規劃販售、行銷或長期發展；請專心把我現在要做的東西做好。\n\n【我想做的東西】\n'+e('idea').value.trim()+'\n\n【主要使用者】\n'+(e('who').value.trim()||'請依我的描述判斷最合理的主要使用者')+'\n\n【第一版基礎規格】\n'+spec+'\n\n【其他需求】\n'+(e('extra').value.trim()||'沒有額外需求，請以完整、直覺、容易使用為主')+'\n\n【視覺風格】\n'+styles+'。請依用途自行安排版面、資訊層級、留白、圓角與字級；手機版必須正常使用。\n\n【技術與完成標準】\n- 如果成果需要互動或資料保存，優先使用純 HTML／CSS／JavaScript 單一檔案與 localStorage；如果只是介紹頁或內容頁，不要硬加後台或資料庫。\n- 不要只做示意畫面，請直接完成可以實際打開與使用的第一版。\n- 畫面上任何按鈕、頁籤、搜尋、篩選、新增、編輯、刪除、儲存、返回、匯入、匯出，只要出現就必須真的能運作。\n- 禁止假按鈕、空函式、# 空連結、TODO、尚未開放或只有外觀沒有邏輯的控制項。做不到就不要顯示。\n- 如果有資料清單，新建／修改／刪除後，清單與統計必須同步。\n- 如果有搜尋或篩選，必須真的改變結果。\n- 如果使用 localStorage，重新整理後資料仍要存在。\n- 需要資料才能看懂或測試的功能，可以放少量清楚標示的示範資料。\n- 手機版要檢查字體大小、按鈕觸控範圍、橫向跑版、固定元素遮擋與不必要的自動跳動。\n- 交付前逐一測試所有互動；任何按鈕沒反應、流程走不完或資料無法保存，都先修正再交付。\n- 一次輸出完整可執行成品，不省略 JavaScript、事件綁定或必要 CSS，不使用「其餘同上」。\n\n請直接製作第一版。'}
e('ideas').addEventListener('click',function(v){var b=v.target.closest('[data-type]');if(b)choose(b.dataset.type)});
e('to2').onclick=function(){if(!type){e('e1').textContent='請先選擇一個方向，或選「自由創作」。';e('e1').classList.add('show');return}if(!e('idea').value.trim()){e('e1').textContent='請先寫下你想做的東西。';e('e1').classList.add('show');return}e('e1').classList.remove('show');show(2);save()};
e('back').onclick=function(){show(1)};e('build').onclick=function(){e('result').textContent=prompt();show(3);save()};e('edit').onclick=function(){show(2)};
a('.chip').forEach(function(c){c.onclick=function(){c.classList.toggle('on');save()}});
e('copy').onclick=async function(){try{await navigator.clipboard.writeText(e('result').textContent)}catch(x){var t=document.createElement('textarea');t.value=e('result').textContent;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}e('toast').classList.add('show');setTimeout(function(){e('toast').classList.remove('show')},1200)};
e('download').onclick=function(){var u=URL.createObjectURL(new Blob([e('result').textContent],{type:'text/plain;charset=utf-8'})),l=document.createElement('a');l.href=u;l.download='MYVERSE-完整製作指令.txt';l.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
e('reset').onclick=function(){if(confirm('要清除目前內容並重新開始嗎？')){localStorage.removeItem(STORE);location.reload()}};
['idea','who','extra'].forEach(function(k){e(k).addEventListener('input',save)});load();render();
})();
</script>
</body></html>
