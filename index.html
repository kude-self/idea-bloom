<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IdeaBloom｜想法展開室</title><style>:root{--ink:#34322e;--muted:#777168;--bg:#f6f3ed;--paper:#fffdf8;--sage:#91a18e;--sage2:#e5ebe2;--clay:#bd897b;--gold:#b79866;--line:#ded8ce}*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 100px}.brand{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 24px}.brand b{font-size:20px}.brand small{color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:26px 20px;margin-bottom:16px;box-shadow:0 14px 40px rgba(50,45,38,.07)}.k{color:var(--clay);font-size:12px;font-weight:800;letter-spacing:.15em}h1{font-size:32px;line-height:1.35;margin:10px 0}h2{font-size:22px;margin:7px 0 10px}p{color:var(--muted);line-height:1.75}textarea{width:100%;min-height:145px;border:1px solid var(--line);border-radius:18px;padding:16px;font:inherit;font-size:16px;background:white;line-height:1.65}.btn{width:100%;border:0;border-radius:17px;padding:15px;margin-top:12px;background:var(--clay);color:white;font-size:16px;font-weight:800}.secondary{background:var(--sage2);color:#52604f}.hidden{display:none}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tag{background:var(--sage2);padding:9px 12px;border-radius:999px;font-size:13px;font-weight:700}.box{border-left:3px solid var(--gold);padding:7px 0 7px 14px;line-height:1.7;margin:14px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{padding:14px 10px;border:1px solid var(--line);border-radius:16px;background:white;text-align:left}.choice.active{background:var(--sage2);border-color:var(--sage)}.choice b{display:block}.choice small{color:var(--muted)}pre{white-space:pre-wrap;background:#302e2a;color:#faf6ee;padding:17px;border-radius:17px;line-height:1.7;font-size:13px;max-height:480px;overflow:auto}@media(max-width:600px){.choices{grid-template-columns:1fr}h1{font-size:28px}}</style></head><body><main class="wrap"><header class="brand"><b>✦ IdeaBloom</b><small>讓想法長成可以做的東西</small></header><section class="card" id="start"><div class="k">START WITH AN IDEA</div><h1>你現在腦中，<br>有什麼想做的？</h1><p>不用整理、不用懂專業名稱。系統、文案、產品、課程、銷售、自媒體或任何想法，都可以直接說。</p><textarea id="idea" placeholder="例如：我是做美睫的，LINE 預約很亂，也想記錄客人上次做什麼，順便知道每月收入。"></textarea><button class="btn" id="go">✦ 幫我展開這個想法</button></section><section id="map" class="hidden"><div class="card"><div class="k">IDEA MAP</div><h2>我先把你的想法拆開</h2><div id="tags" class="tags"></div><div class="box"><b>我理解你真正想處理的是：</b><br><span id="read"></span></div><div class="box"><b>我也會替你補想：</b><br><span id="extra"></span></div></div><div class="card"><h2>你想做到多深？</h2><div class="choices"><button class="choice active" data-v="快速"><b>先做出來</b><small>抓核心，快速產生可執行版本</small></button><button class="choice" data-v="完整"><b>幫我想完整</b><small>補流程、資料、統計與自動化</small></button><button class="choice" data-v="產品"><b>做成真正產品</b><small>加入多人、雲端與未來擴充</small></button></div><button class="btn secondary" id="next">就是這個方向 →</button></div></section><section id="ask" class="card hidden"><div class="k">ONLY WHAT MATTERS</div><h2>再回答一件真正重要的事</h2><p id="question"></p><textarea id="answer" placeholder="想到什麼就寫什麼，不用整理。"></textarea><button class="btn" id="make">產生我的創造藍圖 ✦</button></section><section id="result" class="hidden"><div class="card"><div class="k">CREATION BLUEPRINT</div><h2>已經足夠開始創造</h2><div id="summary" class="box"></div></div><div class="card"><h2>第一版建議</h2><p id="first"></p><h2>之後可以長成</h2><p id="future"></p></div><div class="card"><h2>可直接交給 AI 的製作指令</h2><pre id="prompt"></pre><button class="btn secondary" id="copy">複製完整指令</button></div></section></main><script>(()=>{const q=x=>document.getElementById(x);let depth='快速',tags=[];function show(el){el.classList.remove('hidden');setTimeout(()=>el.scrollIntoView({block:'start'}),30)}function classify(t){if(/美睫|美甲|美容|美業|預約|客人/.test(t))return['顧客','預約','服務紀錄','經營'];if(/記帳|收入|支出|財務|錢/.test(t))return['收支','分類','統計','預算'];if(/課程|學生|教學|學員|學習/.test(t))return['課程','進度','學習','成果'];if(/自媒體|IG|貼文|短影音|內容/.test(t))return['定位','內容','排程','成效'];if(/產品|商品|銷售|微商|訂單|賣/.test(t))return['產品','客戶','銷售','交付'];if(/文案|腳本|寫文/.test(t))return['受眾','訊息','內容','行動'];return['核心需求','使用情境','流程','成果']}q('go').addEventListener('click',()=>{let t=q('idea').value.trim();if(!t){alert('先告訴我一點你的想法就好。');return}tags=classify(t);q('tags').innerHTML=tags.map(x=>'<span class="tag">'+x+'</span>').join('');q('read').textContent='把「'+t+'」整理成以 '+tags.join('、')+' 為核心的可執行成果，而不是先逼你決定技術。';q('extra').textContent='實際使用流程、容易漏掉的資料、第一版真正必要的內容，以及哪些功能應該留到之後。';show(q('map'))});document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');depth=b.dataset.v}));q('next').addEventListener('click',()=>{let s='這個東西做出來後，你最希望它先替你解決哪一件事？';if(tags.includes('顧客'))s='如果今天真的打開它，你最想先看到：今天預約、顧客紀錄、收入，還是其他？';if(tags.includes('收支'))s='你最想一打開就知道哪個數字？例如本月花多少、剩多少、哪類最多？';if(tags.includes('內容'))s='你現在最卡的是不知道發什麼、排程混亂、素材散落，還是看不懂成效？';if(tags.includes('產品'))s='你現在最需要先處理產品定位、銷售、訂單，還是客戶追蹤？';q('question').textContent=s;show(q('ask'))});q('make').addEventListener('click',()=>{let idea=q('idea').value.trim(),a=q('answer').value.trim()||'請依我的核心需求主動規劃最直覺的使用方式';q('summary').innerHTML='<b>原始想法</b><br>'+idea+'<br><br><b>核心</b><br>'+tags.join('、')+'<br><br><b>最重要</b><br>'+a+'<br><br><b>深度</b><br>'+depth;q('first').textContent='先完成真正能解決 '+tags.join('、')+' 的核心版本；只保留必要資料、清楚流程與可實際操作的功能。';q('future').textContent=depth==='產品'?'多人帳號、權限、雲端同步、正式資料庫、商業化與擴充架構。':depth==='完整'?'統計、自動化、提醒、資料關聯、備份與更完整的使用流程。':'先實際使用，再依真正遇到的卡點增加統計、自動化或進階功能。';q('prompt').textContent=`我有一個想法，請把它整理並做成真正可使用的第一版，而不是只做視覺示意。\n\n【原始想法】\n${idea}\n\n【核心方向】\n${tags.join('、')}\n\n【我最在意】\n${a}\n\n【創造深度】\n${depth}\n\n請先理解我要解決的問題，再主動補上我可能沒想到、但實際使用需要的資料、流程、功能、防呆、搜尋篩選、統計或自動化。不要為了功能多而堆功能。\n\n請先告訴我：\n1. 你理解的核心問題\n2. 建議的資料／內容結構\n3. 第一版必要功能或成果\n4. 哪些先不要做\n5. 最適合的製作方式與原因\n\n接著直接製作可實際使用的第一版。若是網頁工具，介面使用繁體中文、手機優先、RWD，所有按鈕必須真的可用。單機需求可用 HTML/CSS/JavaScript + localStorage 並提供匯出／匯入；若涉及多人、登入或跨裝置同步，請採合適的雲端資料庫方案，不要硬套 localStorage。\n\n視覺請依用途建立自己的 Design Tokens，不套固定模板。完成後告訴我如何測試。`;show(q('result'))});q('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(q('prompt').textContent);q('copy').textContent='✓ 已複製'}catch(e){alert('請長按上方文字複製')}})})();</script></body></html>
