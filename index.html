<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MYVERSE｜我的世界創造器</title><style>:root{--ink:#453d3b;--muted:#8e817d;--line:#eadbd5;--paper:#fffdfb;--pink:#f8dfdc;--mint:#e4f0e5;--blue:#e7f0f7;--yellow:#fff1c7;--berry:#c97f78}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff9f4,#fff5ee);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:820px;margin:auto;padding:14px 10px 80px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}.reset{border:0;background:none;text-decoration:underline;color:var(--muted);min-height:44px}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.progress i{height:5px;border-radius:99px;background:#eee4de}.progress i.on{background:var(--berry)}.card{display:none;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:22px 17px}.card.active{display:block}.eyebrow{font-size:11px;color:var(--berry);font-weight:800}h1,h2{line-height:1.45;margin:5px 0 8px}p{color:#6f6460;line-height:1.7}.ideas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.idea{border:1px solid var(--line);border-radius:19px;padding:14px;text-align:left;min-height:96px;color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation}.idea:nth-child(1){background:var(--pink)}.idea:nth-child(2){background:var(--mint)}.idea:nth-child(3){background:var(--blue)}.idea:nth-child(4){background:var(--yellow)}.idea b{display:block;font-size:15px}.idea small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}.idea.on{outline:2px solid var(--berry)}.field{margin:15px 0}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}.hint{font-size:11px;color:var(--muted);font-weight:400}textarea,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink)}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 11px;font:inherit}.chip.on{background:var(--pink)}.nav,.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:8px;margin-top:18px}.btn{border:0;border-radius:17px;min-height:50px;padding:12px;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}.primary{background:linear-gradient(135deg,#d9958b,#c97f78);color:white}.outline{background:white;border:1px solid var(--line)}.result{background:#352f2d;color:#fff8f2;border-radius:17px;padding:15px;white-space:pre-wrap;line-height:1.72;font-size:12.5px;max-height:580px;overflow:auto}.guide{margin-top:16px;background:#fff8e9;border:1px solid #eadcc8;border-radius:18px;padding:13px}.error{display:none;background:#fde8e5;color:#9b544d;padding:9px;border-radius:12px}.error.show{display:block}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#302b29;color:white;padding:9px 13px;border-radius:99px;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(max-width:620px){.row,.actions{grid-template-columns:1fr}.card{padding:19px 13px}.ideas{gap:7px}.idea{min-height:105px;padding:12px}.brand small{display:none}}</style></head><body><main class="app"><header class="top"><div class="brand">✦ MYVERSE｜我的世界創造器<small>一個想法，創造你的世界。</small></div><button class="reset" id="reset">重新開始</button></header><div class="progress"><i class="on"></i><i></i><i></i></div><section class="card active" id="s1"><div class="eyebrow">第 1 步｜選擇方向</div><h1>今天，你想創造什麼？</h1><p>這一版只留下能建立清楚、完整基礎架構的四個方向。先選一個，再改成你的版本。</p><div class="ideas" id="ideas"></div><div class="field"><label>你的想法 <span class="hint">選完後可以修改</span></label><textarea id="idea" placeholder="先選上面的方向，再依你的需求修改。"></textarea></div><div class="error" id="e1"></div><button class="btn primary" id="to2" style="width:100%">繼續整理 ✦</button></section><section class="card" id="s2"><div class="eyebrow">第 2 步｜變成你的</div><h2>補上真正重要的細節</h2><p>不用填很多，只留下會影響成品的資訊。</p><div class="field"><label>主要給誰使用？</label><input id="who" placeholder="例如：我自己／客人／工作室"></div><div class="row"><div class="field"><label>需要記錄哪些資料？</label><textarea id="fields"></textarea></div><div class="field"><label>最常做哪些操作？</label><textarea id="actions"></textarea></div></div><div class="field"><label>其他一定要有的需求 <span class="hint">可留白</span></label><textarea id="extra"></textarea></div><div class="field"><label>想要的風格</label><div class="chips"><button class="chip">溫暖</button><button class="chip">可愛</button><button class="chip">簡約</button><button class="chip">專業</button><button class="chip">自然</button><button class="chip">高級</button></div></div><div class="nav"><button class="btn outline" id="back">← 上一步</button><button class="btn primary" id="build">產生完整指令 ✦</button></div></section><section class="card" id="s3"><div class="eyebrow">第 3 步｜完成</div><h2>你的完整 AI 製作指令</h2><p>整份複製貼給 AI，請它直接完成第一版。</p><pre class="result" id="result"></pre><div class="actions"><button class="btn primary" id="copy">複製完整指令</button><button class="btn outline" id="download">下載 TXT</button></div><div class="guide"><b>測試方式</b><p>完成第一版後，實際點過所有按鈕。若有任何功能沒反應，要求 AI 逐一測試並修正，不新增其他功能。</p></div><button class="btn outline" id="edit" style="width:100%;margin-top:10px">← 回去修改</button></section></main><div class="toast" id="toast">已複製</div><script>(function(){'use strict';var type='',STORE='myverse_core4_v1';var T={booking:{title:'📅 預約單',desc:'服務、日期、時段與預約紀錄',idea:'我想做一個給客人使用的預約單，可以選擇服務、日期與時段，填寫基本資料；我自己可以查看、搜尋、修改與取消預約。',fields:'姓名、聯絡方式、服務項目、日期、時段、備註、預約狀態',actions:'新增預約、選擇日期與時段、搜尋、修改、取消、依日期與狀態篩選'},customer:{title:'♡ 客戶紀錄',desc:'客戶資料、歷史紀錄與搜尋',idea:'我想做一個客戶紀錄系統，可以保存每位客戶的基本資料、服務紀錄、日期與備註，並能搜尋客戶、查看歷史紀錄與編輯資料。',fields:'姓名、聯絡方式、社群帳號、服務紀錄、日期、備註、標籤',actions:'新增客戶、搜尋、篩選、編輯、查看單一客戶完整歷史紀錄'},money:{title:'◫ 記帳工具',desc:'收入支出、分類與月份統計',idea:'我想做一個個人記帳工具，可以記錄收入與支出、分類、日期、金額和備註，並查看每月統計、搜尋紀錄與備份資料。',fields:'收入／支出、日期、金額、分類、備註',actions:'新增、編輯、刪除、搜尋、月份與分類篩選、每月統計、匯出與匯入備份'},tasks:{title:'✓ 任務管理',desc:'任務、期限、狀態與進度',idea:'我想做一個個人任務管理工具，可以建立任務、設定日期、優先順序與完成狀態，並搜尋、篩選與查看目前進度。',fields:'任務名稱、分類、日期、截止日、優先順序、狀態、備註',actions:'新增、編輯、刪除、標記完成、搜尋、依狀態與優先度篩選、查看完成進度'}};function e(i){return document.getElementById(i)}function a(s){return [].slice.call(document.querySelectorAll(s))}function show(n){['s1','s2','s3'].forEach(function(id,i){e(id).classList.toggle('active',i===n-1)});a('.progress i').forEach(function(x,i){x.classList.toggle('on',i<n)});scrollTo(0,0)}function render(){e('ideas').innerHTML=Object.keys(T).map(function(k){var x=T[k];return '<button class="idea '+(type===k?'on':'')+'" data-type="'+k+'"><b>'+x.title+'</b><small>'+x.desc+'</small></button>'}).join('')}function choose(k){type=k;var x=T[k];e('idea').value=x.idea;e('fields').value=x.fields;e('actions').value=x.actions;render();save()}function save(){try{localStorage.setItem(STORE,JSON.stringify({type:type,idea:e('idea').value,who:e('who').value,fields:e('fields').value,actions:e('actions').value,extra:e('extra').value,styles:a('.chip.on').map(function(x){return x.textContent})}))}catch(x){}}function load(){try{var s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;type=s.type||'';['idea','who','fields','actions','extra'].forEach(function(k){e(k).value=s[k]||''});a('.chip').forEach(function(c){c.classList.toggle('on',(s.styles||[]).indexOf(c.textContent)>-1)})}catch(x){}}function prompt(){var x=T[type],styles=a('.chip.on').map(function(c){return c.textContent}).join('、')||'清楚、好閱讀';return '我要請你根據以下資料，直接幫我製作第一版。不要擴張成另一個商業計畫，也不要替我規劃後續販售、行銷或長期發展。\n\n【我想做的東西】\n'+e('idea').value.trim()+'\n\n【類型】\n'+x.title+'\n\n【主要使用者】\n'+(e('who').value.trim()||'請依描述判斷最合理的主要使用者')+'\n\n【核心資料】\n'+e('fields').value.trim()+'\n\n【主要操作】\n'+e('actions').value.trim()+'\n\n【其他需求】\n'+(e('extra').value.trim()||'沒有額外需求，維持第一版簡潔完整')+'\n\n【視覺風格】\n'+styles+'；手機版必須正常使用，文字清楚，按鈕觸控範圍足夠。\n\n【技術規格】\n- 純 HTML／CSS／JavaScript 單一檔案，不需要後端或安裝。\n- 資料使用 localStorage，重新整理後不可消失。\n- 手機與電腦皆需正常使用（RWD）。\n- 提供 JSON 匯出／匯入備份。\n\n【功能完整性硬性要求】\n1. 畫面上每一個按鈕、頁籤、搜尋、篩選、新增、編輯、刪除、儲存、返回、匯入、匯出，只要出現就必須真的能運作。\n2. 禁止假按鈕、空函式、# 空連結、TODO、尚未開放。做不到就不要顯示。\n3. 新增／修改／刪除後，清單與統計立即同步。\n4. 搜尋與篩選必須真的改變結果。\n5. localStorage 必須實際讀寫並通過重新整理測試。\n6. 內建 3～5 筆可刪除的示範資料，讓第一次打開就能測試。\n7. 交付前逐一測試所有互動；任何按鈕沒反應都先修正再交付。\n8. 不增加未被要求的功能，完整與穩定優先。\n9. 一次輸出完整可執行成品，不省略 JavaScript、事件綁定或必要 CSS。\n\n請直接製作第一版。'}e('ideas').addEventListener('click',function(v){var b=v.target.closest('[data-type]');if(b)choose(b.dataset.type)});e('to2').onclick=function(){if(!type){e('e1').textContent='請先選擇一個方向。';e('e1').classList.add('show');return}e('e1').classList.remove('show');show(2);save()};e('back').onclick=function(){show(1)};e('build').onclick=function(){e('result').textContent=prompt();show(3);save()};e('edit').onclick=function(){show(2)};a('.chip').forEach(function(c){c.onclick=function(){c.classList.toggle('on');save()}});e('copy').onclick=async function(){try{await navigator.clipboard.writeText(e('result').textContent)}catch(x){var t=document.createElement('textarea');t.value=e('result').textContent;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}e('toast').classList.add('show');setTimeout(function(){e('toast').classList.remove('show')},1200)};e('download').onclick=function(){var u=URL.createObjectURL(new Blob([e('result').textContent],{type:'text/plain;charset=utf-8'})),l=document.createElement('a');l.href=u;l.download='MYVERSE-完整製作指令.txt';l.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};e('reset').onclick=function(){if(confirm('要清除目前內容並重新開始嗎？')){localStorage.removeItem(STORE);location.reload()}};['idea','who','fields','actions','extra'].forEach(function(k){e(k).addEventListener('input',save)});load();render()})();</script></body></html>
